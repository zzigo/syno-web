<!doctype html><html lang="en"><meta charset="utf-8"><title>syNo hot edit verification</title><body style="background:#101815;color:#cde1bd;font:14px monospace"><button id="render">Render native glide</button><button id="process">Verify persistent process</button><button id="stop">Stop</button><pre id="report">Ready</pre><script type="module">
import {automate,updateAutomation,withAutomationSmoothing} from '/src/audio/automation.ts';
import {AudioEngine} from '/src/audio/engine.ts';import {compile} from '/src/core/parser.ts';
const engine=new AudioEngine(),report=document.querySelector('#report');
document.querySelector('#render').onclick=async()=>{try{const ctx=new OfflineAudioContext(1,48000*3,48000),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain).connect(ctx.destination);automate(osc.frequency,{start:220,end:220,duration:0},0);automate(gain.gain,{start:.2,end:.2,duration:0},0);osc.start();osc.stop(3);withAutomationSmoothing(1,()=>updateAutomation(osc.frequency,{start:440,end:440,duration:0},1,1));withAutomationSmoothing(1,()=>updateAutomation(osc.frequency,{start:330,end:330,duration:0},1.5,1.5));const buffer=await ctx.startRendering(),samples=buffer.getChannelData(0);const measure=(time)=>{const start=Math.floor(time*48000),end=start+4800;let crosses=0,maxDelta=0;for(let i=start+1;i<end;i++){if(samples[i-1]<=0&&samples[i]>0)crosses++;maxDelta=Math.max(maxDelta,Math.abs(samples[i]-samples[i-1]));}return {time,hz:crosses*10,maxDelta};};const windows=[.8,1,1.3,1.5,1.9,2.6].map(measure);report.textContent=JSON.stringify({passed:windows.every(w=>w.maxDelta<.03)&&windows[0].hz<230&&windows.at(-1).hz>=320&&windows.at(-1).hz<=340,windows},null,2);}catch(e){report.textContent=String(e);}};
document.querySelector('#process').onclick=async()=>{try{await engine.start(compile("s220v2'20e0"));let created=0;const ctx=engine.context,create=ctx.createOscillator.bind(ctx);ctx.createOscillator=(...args)=>{created++;return create(...args);};const before=engine.time;await engine.hotUpdate(compile("s330v3'20e0"));await engine.hotUpdate(compile("t440v2'10e0"));report.textContent=JSON.stringify({passed:created===0&&engine.time>=before&&engine.running&&!!engine.queuedScore,newOscillators:created,transport:engine.time,queued:engine.queuedScore?.events[0].wave},null,2);}catch(e){report.textContent=String(e);}};
document.querySelector('#stop').onclick=()=>{engine.stop();report.textContent='Stopped';};
</script></body></html>
