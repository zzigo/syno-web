<!doctype html><html><meta charset="utf-8"><title>syNo dense audio test</title><body style="background:#101815;color:#cee2c0;font:14px monospace"><button id="render">Render dense forest</button><pre id="report">Ready</pre><script type="module">
import {AudioEngine} from '/src/audio/engine.ts';import {compile} from '/src/core/parser.ts';import {presets} from '/src/core/presets.ts';
const report=document.querySelector('#report');document.querySelector('#render').onclick=async()=>{const ctx=new OfflineAudioContext(2,48000*12,48000),engine=new AudioEngine(),Audio=window.AudioContext,resume=ctx.resume.bind(ctx),started=performance.now();report.textContent='Rendering…';try{window.AudioContext=function(){return ctx;};ctx.resume=()=>Promise.resolve();const score=compile(presets.find(p=>p.file==='tunings/13-Tuned-forest-and-cells.syn').code);await engine.start(score);window.AudioContext=Audio;for(let i=1;i<240;i++)ctx.suspend(i*.05).then(()=>{engine.tick();return resume();});const data=await ctx.startRendering(),windows=[];let bad=0;for(let sec=0;sec<12;sec++){let sum=0,peak=0;for(let c=0;c<2;c++)for(let i=sec*48000;i<(sec+1)*48000;i++){const v=data.getChannelData(c)[i];if(!Number.isFinite(v))bad++;else {sum+=v*v;peak=Math.max(peak,Math.abs(v));}}windows.push({sec,rms:Math.sqrt(sum/96000),peak});}report.textContent=JSON.stringify({bad,windows,events:score.events.length,cycle:score.duration,dropped:engine.droppedVoices,elapsedMs:performance.now()-started},null,2);engine.stop();}catch(e){window.AudioContext=Audio;engine.stop();report.textContent=String(e);}};
</script></body></html>
