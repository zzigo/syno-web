<!doctype html><meta charset="utf-8"><title>syNo input routing verification</title><body style="background:#101815;color:#d7e8cc;font:14px monospace"><button id="test">Test synthetic input</button><pre id="report">Ready — this test does not access the physical microphone.</pre><script type="module">
import {AudioEngine} from '/src/audio/engine.ts';import {compile} from '/src/core/parser.ts';
const report=document.querySelector('#report');document.querySelector('#test').onclick=async()=>{const Original=window.AudioContext,ctx=new Original(),dest=ctx.createMediaStreamDestination(),tone=ctx.createOscillator(),gain=ctx.createGain(),engine=new AudioEngine(),get=navigator.mediaDevices.getUserMedia;let requests=0;try{await ctx.resume();tone.frequency.value=440;gain.gain.value=.1;tone.connect(gain).connect(dest);tone.start();navigator.mediaDevices.getUserMedia=async()=>{requests++;return dest.stream;};window.AudioContext=function(){return ctx;};await engine.start(compile("!i1=(0.9) id0.05v6e0'2"));window.AudioContext=Original;navigator.mediaDevices.getUserMedia=get;let peak=0;for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,50));peak=Math.max(peak,engine.health.peak);}engine.stop();const released=dest.stream.getTracks().every(t=>t.readyState==='ended');report.textContent=JSON.stringify({passed:requests===1&&peak>.0001&&released,requests,peak,tracksReleased:released,physicalMicrophone:false},null,2);}catch(e){report.textContent=String(e);}finally{window.AudioContext=Original;navigator.mediaDevices.getUserMedia=get;engine.stop();tone.stop();await ctx.close();}};
</script>
